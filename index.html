<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use env(safe-area-inset-*) around notches and the Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mohannad Alqadery — SOC Analyst, Abu Dhabi</title>
    <meta
      name="description"
      content="Mohannad Alqadery is a SOC analyst in Abu Dhabi working on alert triage, investigation and incident response. SC-200, eJPTv2 and eSOC certified."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Applies the saved light/dark theme before first paint (external file: CSP allows only self). -->
    <script src="/theme-init.js"></script>
    <meta name="author" content="Mohannad Alqadery" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohannad Alqadery" />
    <meta property="og:title" content="Mohannad Alqadery — SOC Analyst" />
    <meta
      property="og:description"
      content="Reading alerts, following the evidence, writing it up. SOC analyst based in Abu Dhabi, UAE."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png?v=%OG_VERSION%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The initials MA drawn in ASCII characters on a dark card"
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; color: #f2f2f2">
        Mohannad Alqadery — SOC Analyst in Abu Dhabi. This site needs JavaScript to render.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
